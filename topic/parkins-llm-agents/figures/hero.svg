<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <title>Animated agent loop: LLM, Tool, Result</title>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#cbd5e1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1280" height="720" fill="url(#fade)"/></mask>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="orbit" d="M960,190 A190,190 0 1,1 959.9,190"/>
  </defs>

  <rect width="1280" height="720" fill="url(#dots)" mask="url(#m)"/>

  <circle cx="960" cy="380" r="190" fill="none" stroke="url(#ring)"
          stroke-width="3" stroke-dasharray="10 12" opacity="0.55">
    <animateTransform attributeName="transform" type="rotate"
      from="0 960 380" to="360 960 380" dur="40s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#glow)">
    <circle r="9" fill="#7c3aed">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#orbit"/>
      </animateMotion>
    </circle>
    <circle r="6" fill="#2563eb" opacity="0.7">
      <animateMotion dur="6s" begin="-0.25s" repeatCount="indefinite">
        <mpath href="#orbit"/>
      </animateMotion>
    </circle>
  </g>

  <g font-family="Inter, Source Sans Pro, Helvetica, sans-serif"
     font-weight="800" font-size="30" text-anchor="middle">
    <g>
      <rect x="890" y="158" width="140" height="64" rx="16" fill="#fff"
            stroke="#2563eb" stroke-width="3">
        <animate attributeName="stroke-width" values="3;7;3" dur="6s"
                 begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="960" y="200" fill="#1e3a8a">LLM</text>
    </g>
    <g>
      <rect x="1065" y="440" width="140" height="64" rx="16" fill="#fff"
            stroke="#f59e0b" stroke-width="3">
        <animate attributeName="stroke-width" values="3;7;3" dur="6s"
                 begin="2s" repeatCount="indefinite"/>
      </rect>
      <text x="1135" y="482" fill="#92400e">Tool</text>
    </g>
    <g>
      <rect x="715" y="440" width="140" height="64" rx="16" fill="#fff"
            stroke="#10b981" stroke-width="3">
        <animate attributeName="stroke-width" values="3;7;3" dur="6s"
                 begin="4s" repeatCount="indefinite"/>
      </rect>
      <text x="785" y="482" fill="#065f46">Result</text>
    </g>
  </g>

  <g font-family="JetBrains Mono, Consolas, monospace" font-size="17"
     fill="#64748b" text-anchor="middle">
    <text x="1135" y="290">decide</text>
    <text x="960" y="608">run</text>
    <text x="785" y="290">read</text>
  </g>
</svg>
